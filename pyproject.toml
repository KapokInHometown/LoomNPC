[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "loom-npc"
version = "0.1.0"
description = "A lightweight, inspectable runtime for game NPCs."
readme = "README.md"
requires-python = ">=3.9"
dependencies = []
keywords = ["npc", "game", "runtime", "llm", "replay"]

[project.scripts]
loom-npc = "loom_npc.cli:main"

[tool.setuptools.packages.find]
include = ["loom_npc*"]

[tool.setuptools.package-data]
loom_npc = ["data/*.json", "integrations/web/*.html", "integrations/web/*.css", "integrations/web/*.js"]
